<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Membres — Abbaye des Fusiliers de Denges</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux: #7a1020;
      --gold:     #c9a84c;
      --gold-lt:  #e8d49a;
      --text:     #1a0a0e;
    }
    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text);
      padding: 1rem;
    }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.2rem;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }
    .search-wrap input {
      flex: 1;
      padding: .55rem 1rem;
      border: 1.5px solid var(--gold);
      border-radius: 30px;
      font-family: 'Crimson Text', serif;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: box-shadow .2s;
    }
    .search-wrap input:focus { box-shadow: 0 0 0 3px rgba(201,168,76,.2); }
    .search-wrap input::placeholder { color: #bbb; font-style: italic; }
    .count {
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      color: var(--bordeaux);
      white-space: nowrap;
      letter-spacing: .05em;
    }
    #status {
      text-align: center;
      padding: 2rem;
      color: var(--bordeaux);
      font-style: italic;
    }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .content { display: none; }
    .table-wrap {
      max-width: 960px;
      margin: 0 auto;
      overflow-x: hidden;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(122,16,32,.10);
    }
    thead tr { background: var(--bordeaux); }
    thead th {
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .9rem 1rem;
      text-align: left;
      border-bottom: 2px solid var(--gold);
      white-space: nowrap;
    }
    thead th.center { text-align: center; }
    tbody tr {
      border-bottom: 1px solid rgba(201,168,76,.15);
      transition: background .15s;
      animation: fadeRow .3s ease both;
    }
    @keyframes fadeRow {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(201,168,76,.06); }
    tbody tr.hidden { display: none; }
    tbody td {
      padding: .65rem 1rem;
      font-size: .98rem;
      vertical-align: middle;
    }
    td.annee {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: .88rem;
      color: var(--bordeaux);
      background: rgba(122,16,32,.04);
      border-right: 2px solid rgba(201,168,76,.18);
      white-space: nowrap;
      width: 70px;
    }
    td.membre { font-weight: 600; color: var(--text); }
    td.membre span.prenom { font-weight: 400; color: #666; margin-left: .3rem; }

    /* Badge statut inline sous le nom sur mobile */
    .badge-inline { display: none; }

    .badge-honoraire {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      background: rgba(201,168,76,.12);
      border: 1px solid rgba(201,168,76,.4);
      color: #7a5c10;
      font-family: 'Cinzel', serif;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      padding: .2rem .55rem;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-actif {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      background: rgba(122,16,32,.07);
      border: 1px solid rgba(122,16,32,.2);
      color: var(--bordeaux);
      font-family: 'Cinzel', serif;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .06em;
      padding: .2rem .55rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Colonne statut cachée sur mobile */
    .col-statut { }

    /* ── MOBILE ── */
    @media (max-width: 560px) {
      thead th, tbody td { padding: .55rem .6rem; }
      td.annee { width: 52px; font-size: .78rem; padding: .55rem .4rem; }

      /* Cache la colonne statut */
      .col-statut, thead th:last-child { display: none; }

      /* Affiche le badge sous le nom */
      .badge-inline { display: inline-flex; margin-top: .2rem; }
      td.membre { display: flex; flex-direction: column; align-items: flex-start; }
      td.membre .nom-prenom { display: block; }
    }

    tfoot td {
      border-top: 1.5px solid rgba(201,168,76,.3);
      padding: .7rem 1rem;
      font-size: .95rem;
      color: #555;
    }
    td.total-label {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: .8rem;
      color: var(--bordeaux);
      background: rgba(122,16,32,.04);
      border-right: 2px solid rgba(201,168,76,.18);
    }

    #noResult {
      text-align: center;
      padding: 2rem;
      font-style: italic;
      color: #999;
      display: none;
    }
  </style>
</head>
<body>

  <div id="status">
    <div class="spinner"></div><br/>Chargement des membres…
  </div>

  <div class="content" id="content">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Rechercher un membre…" autocomplete="off"/>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="center">Entrée</th>
            <th>Membre</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr id="totalRow" style="display:none">
            <td class="total-label">Total</td>
            <td colspan="2" id="totalText"></td>
          </tr>
        </tfoot>
      </table>
      <div id="noResult">Aucun membre trouvé pour cette recherche.</div>
    </div>
  </div>

<script>
  const SHEET_ID = '1UEm9VmH-WwWQKYTR-yj1a4cbhzQ1m_fBsKaYWbPqpvM';
  const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

  function parseCSV(text) {
    return text.trim().split('\n').slice(1).map(line => {
      const cols = []; let cur = '', inQ = false;
      for (const c of line) {
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else cur += c;
      }
      cols.push(cur.trim());
      return cols;
    });
  }

  function buildRow(cols, i) {
    const [annee, nom, prenom, honorariat] = cols;
    const isHonoraire = honorariat && honorariat.toLowerCase() !== 'non' && honorariat.trim() !== '';
    const badgeHTML = isHonoraire
      ? `<span class="badge-honoraire">★ Honoraire ${honorariat}</span>`
      : `<span class="badge-actif">● Actif</span>`;

    const tr = document.createElement('tr');
    tr.style.animationDelay = `${Math.min(i * 15, 400)}ms`;
    tr.dataset.search = `${nom} ${prenom} ${annee}`.toLowerCase();
    tr.innerHTML = `
      <td class="annee">${annee || '—'}</td>
      <td class="membre">
        <span class="nom-prenom"><strong>${nom || ''}</strong><span class="prenom">${prenom || ''}</span></span>
        <span class="badge-inline">${badgeHTML}</span>
      </td>
      <td class="col-statut">${badgeHTML}</td>`;
    return tr;
  }

  function updateCount() {
    const allRows    = document.querySelectorAll('#tbody tr');
    const honoraires = [...allRows].filter(tr => tr.querySelector('.badge-honoraire')).length;
    const totalRow   = document.getElementById('totalRow');
    const totalText  = document.getElementById('totalText');
    if (totalRow)  totalRow.style.display = '';
    if (totalText) totalText.textContent  = `${allRows.length} membres dont ${honoraires} membres honoraires`;
    const visible = document.querySelectorAll('#tbody tr:not(.hidden)').length;
    document.getElementById('count').textContent =
      visible === allRows.length ? `${allRows.length} membres` : `${visible} / ${allRows.length}`;
    document.getElementById('noResult').style.display = visible === 0 ? 'block' : 'none';
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('search').addEventListener('input', function() {
      const q = this.value.toLowerCase().trim();
      document.querySelectorAll('#tbody tr').forEach(tr => {
        tr.classList.toggle('hidden', q && !tr.dataset.search.includes(q));
      });
      updateCount();
    });
  });

  async function load() {
    try {
      const res  = await fetch(CSV_URL);
      if (!res.ok) throw new Error();
      const rows = parseCSV(await res.text());
      const tbody = document.getElementById('tbody');
      rows.forEach((cols, i) => tbody.appendChild(buildRow(cols, i)));
      document.getElementById('status').style.display  = 'none';
      document.getElementById('content').style.display = 'block';
      updateCount();
    } catch {
      document.getElementById('status').innerHTML =
        '<p style="color:#7a1020">⚠️ Impossible de charger les membres.</p>';
    }
  }
  load();
</script>
</body>
</html>
