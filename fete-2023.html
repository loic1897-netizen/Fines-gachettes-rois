<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fête 2023 — Abbaye des Fusiliers de Denges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux: #7a1020;
      --gold:     #c9a84c;
      --gold-lt:  #e8d49a;
      --text:     #1a0a0e;
    }
    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text);
      padding: 1rem;
    }
    .main-layout {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .main-layout { flex-direction: row; align-items: flex-start; }
      .col-left  { flex: 1; min-width: 0; }
      .col-right { flex: 1; min-width: 0; }
    }
    .slideshow {
      width: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(122,16,32,.2), 0 0 0 2px var(--gold);
      background: #111;
      aspect-ratio: 4/3;
    }
    .slideshow img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity .9s ease;
    }
    .slideshow img.active { opacity: 1; }
    .slide-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem .8rem;
      background: linear-gradient(transparent, rgba(0,0,0,.6));
      z-index: 10;
    }
    .slide-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(201,168,76,.5);
      color: var(--gold-lt);
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
      backdrop-filter: blur(4px);
      flex-shrink: 0;
    }
    .slide-btn:hover { background: rgba(201,168,76,.3); }
    .slide-dots {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      justify-content: center;
      flex: 1;
      padding: 0 .5rem;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      cursor: pointer;
      transition: background .2s, transform .2s;
      flex-shrink: 0;
    }
    .dot.active { background: var(--gold); transform: scale(1.3); }
    .slide-pause {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(201,168,76,.5);
      color: var(--gold-lt);
      font-size: .7rem;
      padding: .25rem .6rem;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      letter-spacing: .05em;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .slide-pause:hover { background: rgba(201,168,76,.3); }
    .col-title {
      font-family: 'Cinzel', serif;
      font-size: .72rem;
      color: var(--gold);
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: .35rem .9rem;
      border: 1px solid var(--gold);
      border-radius: 20px;
      background: rgba(201,168,76,.06);
      text-align: center;
      margin-bottom: .8rem;
      display: block;
    }
    .pdf-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .7rem;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: .7rem;
      background: var(--bordeaux);
      padding: .5rem 1rem;
      border-radius: 40px;
      box-shadow: 0 3px 14px rgba(122,16,32,.25);
      border: 1px solid rgba(201,168,76,.3);
    }
    .btn {
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: .95rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn:hover:not(:disabled) { background: var(--gold); color: var(--bordeaux); }
    .btn:disabled { opacity: .3; cursor: default; }
    .page-info {
      font-family: 'Cinzel', serif;
      font-size: .75rem;
      color: var(--gold-lt);
      letter-spacing: .08em;
      min-width: 80px;
      text-align: center;
    }
    .viewer {
      width: 100%;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(122,16,32,.12);
      position: relative;
      cursor: pointer;
    }
    .viewer canvas { display: block; width: 100% !important; height: auto !important; }
    .loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff; gap: .7rem;
      color: var(--bordeaux); font-style: italic;
      min-height: 160px;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading.hidden { display: none; }
    .thumbnails {
      display: flex; gap: .4rem;
      justify-content: center; width: 100%;
    }
    .thumb {
      width: 44px; border: 2px solid transparent;
      border-radius: 4px; cursor: pointer; overflow: hidden;
      transition: opacity .2s, border-color .2s;
    }
    .thumb canvas { display: block; width: 100% !important; height: auto !important; }
    .thumb.active       { border-color: var(--gold); opacity: 1; }
    .thumb.adjacent     { opacity: .45; }
    .thumb.hidden-thumb { display: none; }
  </style>
</head>
<body>

  <div class="main-layout">

    <div class="col-left">
      <span class="col-title">✦ Aperçu en photos ✦</span>
      <div class="slideshow" id="slideshow">
        <div class="slide-controls">
          <button class="slide-btn" id="slidePrev">‹</button>
          <div class="slide-dots" id="dots"></div>
          <button class="slide-pause" id="pauseBtn">⏸ Pause</button>
          <button class="slide-btn" id="slideNext">›</button>
        </div>
      </div>
    </div>

    <div class="col-right">
      <span class="col-title">✦ Compte-rendu de la fête ✦</span>
      <div class="pdf-section">
        <div class="viewer" id="viewer" onclick="window.open('compte-rendu-2023.pdf','_blank')">
          <div class="loading" id="loading">
            <div class="spinner"></div>
            Chargement…
          </div>
          <canvas id="pdfCanvas"></canvas>
        </div>
        <div class="controls" id="ctrl-bot">
          <button class="btn" data-a="first">«</button>
          <button class="btn" data-a="prev">‹</button>
          <span class="page-info" id="pInfo-bot">Page 1 / —</span>
          <button class="btn" data-a="next">›</button>
          <button class="btn" data-a="last">»</button>
        </div>
        <div class="thumbnails" id="thumbs"></div>
      </div>
    </div>

  </div>

<script>
  const PHOTOS = [
    'photos-2023/20230809_093735.jpg',
    'photos-2023/20230813_120039.jpg',
    'photos-2023/20230813_145454.jpg',
    'photos-2023/20230814_174333.jpg',
    'photos-2023/20230814_174400.jpg',
    'photos-2023/8ebb2e7f-6656-44a0-9298-083d78761435.jpg',
    'photos-2023/IMG_3636.jpg',
    'photos-2023/IMG_5605.jpg',
    'photos-2023/IMG_7456.jpg',
    'photos-2023/IMG_7457.jpg',
    'photos-2023/IMG_7460.jpg',
    'photos-2023/IMG_9399.jpg',
    'photos-2023/IMG_9401.jpg',
    'photos-2023/IMG_9447.jpg',
    'photos-2023/IMG_9456.jpg',
    'photos-2023/IMG_9487.jpg',
    'photos-2023/IMG_9495.jpg',
    'photos-2023/IMG_9505.jpg',
    'photos-2023/IMG_9550.jpg',
    'photos-2023/IMG_9555.jpg',
    'photos-2023/IMG_9562.jpg',
    'photos-2023/IMG_9574.jpg',
    'photos-2023/IMG_9646.jpg',
    'photos-2023/d3894534-242d-4fb7-8258-afe2aa202d7c.jpg'
  ];

  const shuffled = [...PHOTOS].sort(() => Math.random() - 0.5);
  const ss     = document.getElementById('slideshow');
  const dotsEl = document.getElementById('dots');
  let validPhotos = [], cur = 0, timer = null, paused = false;

  let loaded = 0;
  shuffled.forEach(src => {
    const img = new Image();
    img.onload  = () => { validPhotos.push(src); loaded++; if (loaded === shuffled.length) buildSlideshow(); };
    img.onerror = () => {                         loaded++; if (loaded === shuffled.length) buildSlideshow(); };
    img.src = src;
  });

  function buildSlideshow() {
    validPhotos.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = `Fête 2023 — photo ${i+1}`;
      if (i === 0) img.classList.add('active');
      ss.insertBefore(img, ss.querySelector('.slide-controls'));
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.onclick = () => goSlide(i);
      dotsEl.appendChild(dot);
    });
    startTimer();
  }

  function goSlide(n) {
    const imgs = document.querySelectorAll('.slideshow img');
    const dts  = document.querySelectorAll('.dot');
    if (!imgs.length) return;
    imgs[cur].classList.remove('active');
    dts[cur].classList.remove('active');
    cur = (n + validPhotos.length) % validPhotos.length;
    imgs[cur].classList.add('active');
    dts[cur].classList.add('active');
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => goSlide(cur + 1), 4000);
  }

  document.getElementById('slidePrev').onclick = () => { goSlide(cur - 1); if (!paused) startTimer(); };
  document.getElementById('slideNext').onclick = () => { goSlide(cur + 1); if (!paused) startTimer(); };
  document.getElementById('pauseBtn').onclick  = function() {
    paused = !paused;
    this.textContent = paused ? '▶ Play' : '⏸ Pause';
    paused ? clearInterval(timer) : startTimer();
  };

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = 'compte-rendu-2023.pdf';
  let pdfDoc = null, curPage = 1;
  const scale  = 1.5;
  const canvas = document.getElementById('pdfCanvas');
  const ctx    = canvas.getContext('2d');

  function updatePdfUI() {
    const total = pdfDoc.numPages;
    document.getElementById('pInfo-bot').textContent = `Page ${curPage} / ${total}`;
    document.querySelectorAll('[data-a="first"],[data-a="prev"]')
      .forEach(b => b.disabled = curPage <= 1);
    document.querySelectorAll('[data-a="last"],[data-a="next"]')
      .forEach(b => b.disabled = curPage >= total);
    updateThumbs();
  }

  async function renderPage(n) {
    document.getElementById('loading').classList.remove('hidden');
    const page = await pdfDoc.getPage(n);
    const vp   = page.getViewport({ scale });
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    document.getElementById('loading').classList.add('hidden');
    updatePdfUI();
  }

  function goPage(n) {
    if (!pdfDoc || n < 1 || n > pdfDoc.numPages) return;
    curPage = n;
    renderPage(curPage);
  }

  document.getElementById('ctrl-bot').addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const a = btn.dataset.a;
    if (a === 'first') goPage(1);
    if (a === 'prev')  goPage(curPage - 1);
    if (a === 'next')  goPage(curPage + 1);
    if (a === 'last')  goPage(pdfDoc.numPages);
  });

  function updateThumbs() {
    document.querySelectorAll('.thumb').forEach(t => {
      const p = parseInt(t.dataset.page);
      if (p === curPage)                            t.className = 'thumb active';
      else if (p === curPage-1 || p === curPage+1) t.className = 'thumb adjacent';
      else                                          t.className = 'thumb hidden-thumb';
    });
  }

  async function buildThumbs(pdf) {
    const container = document.getElementById('thumbs');
    for (let i = 1; i <= pdf.numPages; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb hidden-thumb';
      wrap.dataset.page = i;
      const c = document.createElement('canvas');
      wrap.appendChild(c);
      container.appendChild(wrap);
      wrap.addEventListener('click', e => {
        e.stopPropagation();
        goPage(i);
      });
      const page = await pdf.getPage(i);
      const vp   = page.getViewport({ scale: 0.15 });
      c.width = vp.width; c.height = vp.height;
      page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    }
    updateThumbs();
  }

  pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
    buildThumbs(pdf);
  });
</script>
</body>
</html>
