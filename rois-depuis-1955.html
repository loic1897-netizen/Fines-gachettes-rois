<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les Rois — Les Fines Gâchettes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux:    #7a1020;
      --bordeaux-dk: #4e0a15;
      --gold:        #c9a84c;
      --gold-lt:     #e8d49a;
      --text:        #1a0a0e;
    }
    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text);
      padding: 1rem;
    }
    #status {
      text-align: center;
      padding: 2rem;
      color: var(--bordeaux);
      font-style: italic;
    }
    .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: .5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .content { display: none; }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(122,16,32,.10);
    }
    thead tr { background: var(--bordeaux); }
    thead th {
      font-family: 'Cinzel', serif;
      font-size: .78rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .9rem 1rem;
      text-align: left;
      border-bottom: 2px solid var(--gold);
      white-space: nowrap;
    }
    thead th:first-child { text-align: center; width: 72px; }
    tbody tr {
      border-bottom: 1px solid rgba(201,168,76,.15);
      transition: background .15s;
      animation: fadeRow .4s ease both;
    }
    @keyframes fadeRow {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(201,168,76,.07); }
    tbody td {
      padding: .75rem 1rem;
      font-size: 1rem;
      vertical-align: middle;
    }
    td.year {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: .95rem;
      color: var(--bordeaux);
      background: rgba(122,16,32,.04);
      border-right: 2px solid rgba(201,168,76,.2);
    }
    .name  { display: block; font-weight: 600; }
    .score { display: inline-block; margin-top: .15rem; font-size: .82rem; font-style: italic; color: #999; }
    .col-roi    .name { color: var(--bordeaux); }
    .col-vice   .name { color: #444; }
    .col-venoge .name { color: #1a5276; }
    .separator {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin: 2.8rem 0;
    }
    .separator-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .separator-icon {
      font-family: 'Cinzel', serif;
      font-size: .72rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: .4rem .9rem;
      border: 1px solid var(--gold);
      border-radius: 20px;
      background: rgba(201,168,76,.06);
    }
    .col-jubile { font-family: 'Cinzel', serif; font-weight: 600; color: var(--bordeaux); font-size: .9rem; }
    .col-critere { font-style: italic; color: #666; font-size: .9rem; }
    @media (max-width: 600px) {
      thead th, tbody td { padding: .6rem .65rem; font-size: .85rem; }
      .score { font-size: .75rem; }
      .separator-icon { font-size: .65rem; }
    }
  </style>
</head>
<body>
  <div id="status">
    <div class="spinner"></div><br/>Chargement…
  </div>
  <div class="content" id="content">
    <table>
      <thead>
        <tr>
          <th>Fête</th>
          <th>Roi Société</th>
          <th>Vice-Roi Société</th>
          <th>Roi Venoge</th>
        </tr>
      </thead>
      <tbody id="tbody1"></tbody>
    </table>
    <div class="separator">
      <div class="separator-line"></div>
      <div class="separator-icon">✦ Rois Cibles Anniversaires ✦</div>
      <div class="separator-line"></div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Fête</th>
          <th>Jubilé</th>
          <th>Roi</th>
          <th>Critère</th>
        </tr>
      </thead>
      <tbody id="tbody2"></tbody>
    </table>
  </div>
<script>
  const SHEET_ID = '1nWiyU08h_eG5zAC2515ePoAskOBoEoY28I6cdiUN9o4';
  const CSV1 = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
  const CSV2 = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=163845732`;
  function parseCSV(text) {
    return text.trim().split('\n').slice(1).map(line => {
      const cols = []; let cur = '', inQ = false;
      for (const c of line) {
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else cur += c;
      }
      cols.push(cur.trim());
      return cols;
    });
  }
  function split(cell) {
    const m = cell.match(/^(.+?),\s*(\d.*)/);
    return m ? { name: m[1].trim(), score: m[2].trim() } : { name: cell, score: '' };
  }
  function buildRow1(cols, i) {
    const [year, roi, vice, venoge] = cols;
    const r = split(roi||''), vr = split(vice||''), v = split(venoge||'');
    const tr = document.createElement('tr');
    tr.style.animationDelay = `${i * 35}ms`;
    tr.innerHTML = `
      <td class="year">${year}</td>
      <td class="col-roi"><span class="name">${r.name}</span>${r.score ? `<span class="score">${r.score}</span>` : ''}</td>
      <td class="col-vice"><span class="name">${vr.name}</span>${vr.score ? `<span class="score">${vr.score}</span>` : ''}</td>
      <td class="col-venoge"><span class="name">${v.name}</span>${v.score ? `<span class="score">${v.score}</span>` : ''}</td>`;
    return tr;
  }
  function buildRow2(cols, i) {
    const [year, jubile, roi, critere] = cols;
    const r = split(roi||'');
    const tr = document.createElement('tr');
    tr.style.animationDelay = `${i * 80}ms`;
    tr.innerHTML = `
      <td class="year">${year}</td>
      <td class="col-jubile">${jubile||''}</td>
      <td class="col-roi"><span class="name">${r.name}</span>${r.score ? `<span class="score">${r.score}</span>` : ''}</td>
      <td class="col-critere">${critere||''}</td>`;
    return tr;
  }
  async function load() {
    try {
      const [res1, res2] = await Promise.all([fetch(CSV1), fetch(CSV2)]);
      if (!res1.ok || !res2.ok) throw new Error('Erreur réseau');
      const rows1 = parseCSV(await res1.text());
      const rows2 = parseCSV(await res2.text());
      const tbody1 = document.getElementById('tbody1');
      const tbody2 = document.getElementById('tbody2');
      rows1.forEach((cols, i) => tbody1.appendChild(buildRow1(cols, i)));
      rows2.forEach((cols, i) => tbody2.appendChild(buildRow2(cols, i)));
      document.getElementById('status').style.display  = 'none';
      document.getElementById('content').style.display = 'block';
    } catch(e) {
      document.getElementById('status').innerHTML = `<p style="color:var(--bordeaux)">⚠️ Impossible de charger les données.</p>`;
    }
  }
  load();
</script>
</body>
</html>
