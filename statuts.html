<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Statuts — Abbaye des Fusiliers de Denges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux: #7a1020;
      --gold:     #c9a84c;
      --gold-lt:  #e8d49a;
      --cream:    #faf6ef;
      --text:     #1a0a0e;
    }

    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
    }

    /* ── CONTRÔLES ── */
    .controls {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--bordeaux);
      padding: .55rem 1.2rem;
      border-radius: 40px;
      box-shadow: 0 3px 14px rgba(122,16,32,.25);
      border: 1px solid rgba(201,168,76,.3);
    }

    .btn {
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn:hover:not(:disabled) { background: var(--gold); color: var(--bordeaux); }
    .btn:disabled { opacity: .3; cursor: default; }

    .page-info {
      font-family: 'Cinzel', serif;
      font-size: .8rem;
      color: var(--gold-lt);
      letter-spacing: .08em;
      white-space: nowrap;
      min-width: 90px;
      text-align: center;
    }

    .zoom-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 .2rem;
      opacity: .8;
      transition: opacity .15s;
    }
    .zoom-btn:hover { opacity: 1; }

    /* ── CANVAS WRAPPER ── */
    .viewer {
      width: 100%;
      max-width: 780px;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 6px 32px rgba(122,16,32,.13), 4px 4px 0 rgba(201,168,76,.15);
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    /* ── LOADING ── */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      gap: .8rem;
      color: var(--bordeaux);
      font-style: italic;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading.hidden { display: none; }

    /* ── MINIATURES ── */
    .thumbnails {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 780px;
      width: 100%;
    }
    .thumb {
      width: 52px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      opacity: .55;
      transition: opacity .15s, border-color .15s;
      overflow: hidden;
    }
    .thumb:hover { opacity: .85; }
    .thumb.active { border-color: var(--gold); opacity: 1; }
    .thumb canvas { display: block; width: 100% !important; height: auto !important; }

    /* ── NOTE ── */
    .note {
      font-size: .8rem;
      font-style: italic;
      color: #999;
      text-align: center;
      max-width: 600px;
    }

    @media (max-width: 500px) {
      .thumb { width: 38px; }
      .controls { gap: .5rem; padding: .5rem .9rem; }
    }
  </style>
</head>
<body>

  <!-- CONTRÔLES -->
  <div class="controls">
    <button class="btn" id="first" title="Première page">«</button>
    <button class="btn" id="prev" title="Page précédente">‹</button>
    <span class="page-info" id="pageInfo">Page 1 / —</span>
    <button class="btn" id="next" title="Page suivante">›</button>
    <button class="btn" id="last" title="Dernière page">»</button>
    <span style="width:1px;height:20px;background:rgba(201,168,76,.3);margin:0 .3rem"></span>
    <button class="zoom-btn" id="zoomOut" title="Zoom arrière">−</button>
    <button class="zoom-btn" id="zoomIn" title="Zoom avant">+</button>
  </div>

  <!-- VISIONNEUR -->
  <div class="viewer" id="viewer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Chargement des statuts…
    </div>
    <canvas id="pdfCanvas"></canvas>
  </div>

  <!-- MINIATURES -->
  <div class="thumbnails" id="thumbnails"></div>

  <p class="note">⚠️ En cas de divergence, seule la version imprimée officielle remise à chaque membre fait foi.</p>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ← Chemin vers le PDF (dans le même dossier GitHub)
  const PDF_URL = 'Statuts2020_-_Abbaye_des_Fusiliers_de_Denges.pdf';

  let pdfDoc = null, currentPage = 1, scale = 1.5;
  const canvas  = document.getElementById('pdfCanvas');
  const ctx     = canvas.getContext('2d');
  const loading = document.getElementById('loading');
  const info    = document.getElementById('pageInfo');

  async function renderPage(n) {
    loading.classList.remove('hidden');
    const page    = await pdfDoc.getPage(n);
    const viewport = page.getViewport({ scale });
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    loading.classList.add('hidden');
    info.textContent = `Page ${n} / ${pdfDoc.numPages}`;
    updateButtons();
    highlightThumb(n);
  }

  function updateButtons() {
    document.getElementById('prev').disabled  = currentPage <= 1;
    document.getElementById('first').disabled = currentPage <= 1;
    document.getElementById('next').disabled  = currentPage >= pdfDoc.numPages;
    document.getElementById('last').disabled  = currentPage >= pdfDoc.numPages;
  }

  function go(n) {
    if (n < 1 || n > pdfDoc.numPages) return;
    currentPage = n;
    renderPage(currentPage);
  }

  document.getElementById('first').onclick = () => go(1);
  document.getElementById('prev').onclick  = () => go(currentPage - 1);
  document.getElementById('next').onclick  = () => go(currentPage + 1);
  document.getElementById('last').onclick  = () => go(pdfDoc.numPages);

  document.getElementById('zoomIn').onclick = () => {
    if (scale >= 2.5) return;
    scale = Math.min(scale + 0.25, 2.5);
    renderPage(currentPage);
  };
  document.getElementById('zoomOut').onclick = () => {
    if (scale <= 0.75) return;
    scale = Math.max(scale - 0.25, 0.75);
    renderPage(currentPage);
  };

  // Miniatures
  async function buildThumbs(pdf) {
    const container = document.getElementById('thumbnails');
    for (let i = 1; i <= pdf.numPages; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb' + (i === 1 ? ' active' : '');
      wrap.dataset.page = i;
      const c = document.createElement('canvas');
      wrap.appendChild(c);
      container.appendChild(wrap);
      wrap.onclick = () => go(parseInt(wrap.dataset.page));

      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 0.15 });
      c.width = vp.width; c.height = vp.height;
      page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    }
  }

  function highlightThumb(n) {
    document.querySelectorAll('.thumb').forEach(t => {
      t.classList.toggle('active', parseInt(t.dataset.page) === n);
    });
  }

  // Chargement
  pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
    buildThumbs(pdf);
  }).catch(() => {
    loading.innerHTML = '<p style="color:var(--bordeaux);padding:2rem">⚠️ Impossible de charger le PDF.</p>';
  });
</script>
</body>
</html>
