<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Statuts — Abbaye des Fusiliers de Denges</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bordeaux: #7a1020;
      --gold:     #c9a84c;
      --gold-lt:  #e8d49a;
    }
    body {
      background: transparent;
      font-family: 'Crimson Text', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: 1rem;
    }
    .controls-top {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--bordeaux);
      padding: .55rem 1.2rem;
      border-radius: 40px;
      box-shadow: 0 3px 14px rgba(122,16,32,.25);
      border: 1px solid rgba(201,168,76,.3);
    }
    .controls-bottom {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--bordeaux);
      padding: .55rem 1.2rem;
      border-radius: 40px;
      box-shadow: 0 3px 20px rgba(122,16,32,.35);
      border: 1px solid rgba(201,168,76,.3);
    }
    .btn {
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      width: 34px; height: 34px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .btn:hover:not(:disabled) { background: var(--gold); color: var(--bordeaux); }
    .btn:disabled { opacity: .3; cursor: default; }
    .page-info {
      font-family: 'Cinzel', serif;
      font-size: .8rem;
      color: var(--gold-lt);
      letter-spacing: .08em;
      white-space: nowrap;
      min-width: 90px;
      text-align: center;
    }
    .viewer {
      width: 100%;
      max-width: 780px;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 8px;
      box-shadow: 0 6px 32px rgba(122,16,32,.13), 4px 4px 0 rgba(201,168,76,.15);
      overflow: hidden;
      position: relative;
    }
    canvas { display: block; width: 100% !important; height: auto !important; }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      gap: .8rem;
      color: var(--bordeaux);
      font-style: italic;
      min-height: 200px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--gold-lt);
      border-top-color: var(--bordeaux);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading.hidden { display: none; }
    .thumbnails {
      display: flex;
      gap: .5rem;
      justify-content: center;
      max-width: 780px;
      width: 100%;
    }
    .thumb {
      width: 52px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      transition: opacity .2s, border-color .2s;
    }
    .thumb canvas { display: block; width: 100% !important; height: auto !important; }
    .thumb.active       { border-color: var(--gold); opacity: 1; }
    .thumb.adjacent     { opacity: .45; }
    .thumb.hidden-thumb { display: none; }
    .note {
      font-size: .8rem;
      font-style: italic;
      color: #999;
      text-align: center;
      max-width: 600px;
    }
    @media (max-width: 500px) {
      .thumb { width: 38px; }
      .controls-top, .controls-bottom { gap: .5rem; padding: .5rem .9rem; }
    }
  </style>
</head>
<body>

  <!-- BARRE HAUTE -->
  <div class="controls-top" id="controls-top">
    <button class="btn" data-action="first">«</button>
    <button class="btn" data-action="prev">‹</button>
    <span class="page-info" id="pageInfo-top">Page 1 / —</span>
    <button class="btn" data-action="next">›</button>
    <button class="btn" data-action="last">»</button>
  </div>

  <!-- VISIONNEUR -->
  <div class="viewer" id="viewer">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      Chargement des statuts…
    </div>
    <canvas id="pdfCanvas"></canvas>
  </div>

  <!-- BARRE BASSE -->
  <div class="controls-bottom" id="controls-bottom">
    <button class="btn" data-action="first">«</button>
    <button class="btn" data-action="prev">‹</button>
    <span class="page-info" id="pageInfo-bottom">Page 1 / —</span>
    <button class="btn" data-action="next">›</button>
    <button class="btn" data-action="last">»</button>
  </div>

  <!-- MINIATURES -->
  <div class="thumbnails" id="thumbnails"></div>

  <p class="note">⚠️ En cas de divergence, seule la version imprimée officielle remise à chaque membre fait foi.</p>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = 'Statuts2020_-_Abbaye_des_Fusiliers_de_Denges.pdf';

  let pdfDoc = null, currentPage = 1;
  const scale = 1.5;
  const canvas = document.getElementById('pdfCanvas');
  const ctx    = canvas.getContext('2d');

  function updateUI() {
    const total = pdfDoc.numPages;
    ['top', 'bottom'].forEach(id => {
      document.getElementById(`pageInfo-${id}`).textContent = `Page ${currentPage} / ${total}`;
    });
    document.querySelectorAll('.btn[data-action="first"], .btn[data-action="prev"]')
      .forEach(b => b.disabled = currentPage <= 1);
    document.querySelectorAll('.btn[data-action="last"], .btn[data-action="next"]')
      .forEach(b => b.disabled = currentPage >= total);
    updateThumbs();
  }

  async function renderPage(n) {
    document.getElementById('loading').classList.remove('hidden');
    const page     = await pdfDoc.getPage(n);
    const viewport = page.getViewport({ scale });
    canvas.width   = viewport.width;
    canvas.height  = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById('loading').classList.add('hidden');
    updateUI();
  }

  function go(n) {
    if (!pdfDoc || n < 1 || n > pdfDoc.numPages) return;
    currentPage = n;
    renderPage(currentPage);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  ['controls-top', 'controls-bottom'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const a = btn.dataset.action;
      if (a === 'first') go(1);
      if (a === 'prev')  go(currentPage - 1);
      if (a === 'next')  go(currentPage + 1);
      if (a === 'last')  go(pdfDoc.numPages);
    });
  });

  function updateThumbs() {
    document.querySelectorAll('.thumb').forEach(t => {
      const p = parseInt(t.dataset.page);
      if (p === currentPage)                                    { t.className = 'thumb active'; }
      else if (p === currentPage - 1 || p === currentPage + 1) { t.className = 'thumb adjacent'; }
      else                                                      { t.className = 'thumb hidden-thumb'; }
    });
  }

  async function buildThumbs(pdf) {
    const container = document.getElementById('thumbnails');
    for (let i = 1; i <= pdf.numPages; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'thumb hidden-thumb';
      wrap.dataset.page = i;
      const c = document.createElement('canvas');
      wrap.appendChild(c);
      container.appendChild(wrap);
      wrap.addEventListener('click', () => go(parseInt(wrap.dataset.page)));
      const page = await pdf.getPage(i);
      const vp   = page.getViewport({ scale: 0.15 });
      c.width = vp.width; c.height = vp.height;
      page.render({ canvasContext: c.getContext('2d'), viewport: vp });
    }
    updateThumbs();
  }

  pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
    pdfDoc = pdf;
    renderPage(1);
    buildThumbs(pdf);
  }).catch(() => {
    document.getElementById('loading').innerHTML =
      '<p style="color:#7a1020;padding:2rem">⚠️ Impossible de charger le PDF.</p>';
  });
</script>
</body>
</html>
